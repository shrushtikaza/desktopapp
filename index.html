<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>music player</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f2f2f2;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .bg {
      position: relative;
      width: 240px;
      height: 300px;
      border: 2px solid #1d1b1b;
      border-radius: 12px;
      background: rgb(99, 189, 164);
      padding: 15px;
      box-sizing: border-box;
    }

    .screen {
      width: 180px;
      height: 140px;
      border: 2px solid black;
      border-radius: 8px;
      background: rgb(217, 255, 234);
      margin: 0 auto; 
    }

    .scroller {
      width: 180px;
      height: 10px;
      border: 2px solid black;
      border-radius: 12px;
      background: rgb(255, 236, 71);
      position: relative;
      margin: 15px auto 0;
    }

    .location {
      width: 12px;
      height: 12px;
      background: rgb(242, 5, 83);
      border: 2px solid black;
      border-radius: 50%;
      position: absolute;
      top: -3px;
      left: 40%;
    }

    .controls {
      margin-top: 25px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .btn, .playpause {
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgb(217, 255, 234);
      border: 2px solid black;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .btn {
      width: 50px;
      height: 50px;
      border-radius: 8px;
    }

    .playpause {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      position: relative;
    }

    .btn:hover,
    .playpause:hover {
      cursor: pointer;
      transform: scale(1.05);
      background: #d4fae3;
    }

    .btn svg {
      width: 28px;
      height: 28px;
      stroke: black;
      stroke-width: 2px;
      fill: rgb(242, 5, 83);
      border-radius: 4px;
    }
    
    .playpause svg{
      width: 42px;
      height: 42px;
      stroke: black;
      stroke-width: 1px;
      fill: rgb(242, 5, 83);
      border-radius: 4px;
      transform: scale(1.3);
    }


    .pauseicon {
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: center;
    }

    .pausebar {
      width: 7px;
      height: 35px;
      background: rgb(242, 5, 83);
      border: 2px solid black;
      border-radius: 4px;
    }

    .pauseicon,
    .playicon {
      position: absolute;
    }

    .pauseicon {
      display: none;
    }
    

  </style>
</head>
<body>
  <div class="bg">
    <div class="screen"></div>
    <div class="scroller">
      <div class="location"></div>
    </div>
    <div class="controls">
      <div class="btn">
        <i data-lucide="skip-back"></i>
      </div>

      <div class="playpause" id="playPauseBtn">
        <i data-lucide="play" class="playicon"></i>
        <div class="pauseicon">
          <div class="pausebar"></div>
          <div class="pausebar"></div>
        </div>
      </div>

      <div class="btn">
        <i data-lucide="skip-forward"></i>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = playPauseBtn.querySelector('.playicon');
    const pauseIcon = playPauseBtn.querySelector('.pauseicon');

    let isPlaying = false;

    playPauseBtn.addEventListener('click', () => {
      isPlaying = !isPlaying;

      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'flex';
      } else {
        playIcon.style.display = 'inline';
        pauseIcon.style.display = 'none';
      }
    });
  </script>
</body>
</html>
